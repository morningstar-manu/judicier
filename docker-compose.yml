# Stack GestiPers (Judicier) — projet Compose dans /opt/app sur la VM Bangui.
# Contrat reverse-proxy : port hôte 8080 -> conteneur 3000. NE PAS modifier.
services:
  gestipers:
    image: ghcr.io/infra-bangui/gestipers:${IMAGE_TAG:-latest}
    container_name: gestipers
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      GESTIPERS_API_SECRET: ${GESTIPERS_API_SECRET:-}
      ARIA_IDENTITE_URL: ${ARIA_IDENTITE_URL:-}
      ARIA_IDENTITE_API_KEY: ${ARIA_IDENTITE_API_KEY:-}
      ARIA_REQUESTER_ID: ${ARIA_REQUESTER_ID:-gestipers}
      ARIA_LEGAL_BASIS: ${ARIA_LEGAL_BASIS:-}
    env_file:
      - path: .env.secrets
        required: false
    mem_limit: 2g
    memswap_limit: 2g
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
