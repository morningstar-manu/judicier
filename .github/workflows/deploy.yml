name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/infra-bangui/gestipers
  SERVER: manu@192.168.10.186
  SERVER_DIR: /opt/app
  SSH_KEY: /opt/github-runner/.ssh/deploy_key

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_APP_URL=https://gestipers.datapr.org
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Déploiement Bangui uniquement depuis le dépôt org Infra-Bangui/gestipers
    # (miroir du code morningstar-manu/judicier). Sur judicier : build seul.
    if: github.repository == 'Infra-Bangui/gestipers'
    runs-on: [self-hosted, bangui]
    environment: production
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Copier les fichiers de déploiement
        run: |
          scp -o StrictHostKeyChecking=accept-new -i "$SSH_KEY" \
            docker-compose.yml deploy/deploy.sh deploy/rollback.sh \
            "$SERVER:$SERVER_DIR/"

      - name: Déployer ${{ needs.build.outputs.tag }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i "$SSH_KEY" "$SERVER" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             chmod +x $SERVER_DIR/deploy.sh $SERVER_DIR/rollback.sh && \
             $SERVER_DIR/deploy.sh ${{ needs.build.outputs.tag }}"
